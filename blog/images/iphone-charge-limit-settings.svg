<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" viewBox="0 0 760 1500" role="img" aria-labelledby="title desc">
  <title id="title">iPhone charge limit settings screenshot style guide</title>
  <desc id="desc">Illustrated screenshot showing iPhone settings path for limiting charge to 80 percent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <rect width="760" height="1500" fill="url(#bg)"/>
  <rect x="70" y="42" width="620" height="1416" rx="78" fill="#030712" stroke="#334155" stroke-width="6"/>
  <rect x="108" y="124" width="544" height="1260" rx="44" fill="url(#screen)" stroke="#475569" stroke-width="3"/>

  <text x="380" y="188" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Settings</text>
  <text x="130" y="244" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="24">Battery</text>

  <rect x="130" y="274" width="500" height="132" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="330" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="28">Battery Health &amp; Charging</text>
  <text x="160" y="368" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="21">Optimized charging and charge limit</text>
  <text x="603" y="347" text-anchor="end" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="28">&gt;</text>

  <text x="130" y="472" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="24">Charging</text>
  <rect x="130" y="500" width="500" height="116" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="570" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="29">Charge Limit</text>
  <text x="590" y="570" text-anchor="end" fill="#22c55e" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">80%</text>

  <rect x="130" y="648" width="500" height="116" rx="18" fill="#0f766e" stroke="#14b8a6" stroke-width="3"/>
  <text x="160" y="718" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Optimized Battery Charging</text>
  <rect x="554" y="682" width="54" height="30" rx="15" fill="#22c55e"/>
  <circle cx="592" cy="697" r="13" fill="#f0fdf4"/>

  <rect x="126" y="498" width="508" height="120" rx="20" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <text x="130" y="824" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Set this to 80% for daily use.</text>
  <text x="130" y="856" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Use 85% or 90% only if you need extra runtime.</text>

  <rect x="130" y="912" width="500" height="190" rx="20" fill="#111827" stroke="#334155"/>
  <text x="154" y="954" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Path:</text>
  <text x="154" y="994" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Settings &gt; Battery &gt; Charging</text>
  <text x="154" y="1032" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">&gt; Charge Limit (80%)</text>

  <text x="380" y="1318" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="20">Illustrative screenshot style guide</text>
</svg>
