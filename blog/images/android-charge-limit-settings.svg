<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1500" viewBox="0 0 760 1500" role="img" aria-labelledby="title desc">
  <title id="title">Android charge limit settings screenshot style guide</title>
  <desc id="desc">Illustrated screenshot showing Android settings paths for battery charging limit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>

  <rect width="760" height="1500" fill="url(#bg)"/>
  <rect x="70" y="42" width="620" height="1416" rx="78" fill="#030712" stroke="#334155" stroke-width="6"/>
  <rect x="108" y="124" width="544" height="1260" rx="44" fill="url(#screen)" stroke="#475569" stroke-width="3"/>

  <text x="380" y="188" text-anchor="middle" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Settings</text>
  <text x="130" y="246" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="24">Battery</text>

  <rect x="130" y="278" width="500" height="120" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="350" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="29">Charging optimization</text>

  <rect x="130" y="430" width="500" height="120" rx="18" fill="#0f766e" stroke="#14b8a6" stroke-width="3"/>
  <text x="160" y="502" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700">Limit to 80%</text>
  <text x="603" y="503" text-anchor="end" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="28">ON</text>

  <text x="130" y="616" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="24">Samsung path</text>
  <rect x="130" y="648" width="500" height="116" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="160" y="720" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="28">Battery protection</text>

  <rect x="130" y="796" width="500" height="116" rx="18" fill="#0f766e" stroke="#14b8a6" stroke-width="3"/>
  <text x="160" y="868" fill="#ecfeff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Maximum (80%)</text>

  <rect x="126" y="428" width="508" height="124" rx="20" fill="none" stroke="#f59e0b" stroke-width="4"/>
  <rect x="126" y="794" width="508" height="120" rx="20" fill="none" stroke="#f59e0b" stroke-width="4"/>

  <rect x="130" y="964" width="500" height="220" rx="20" fill="#111827" stroke="#334155"/>
  <text x="154" y="1008" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Common paths:</text>
  <text x="154" y="1048" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Pixel: Settings &gt; Battery &gt; Charging</text>
  <text x="154" y="1083" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">optimization &gt; Limit to 80%</text>
  <text x="154" y="1125" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Samsung: Settings &gt; Battery &gt; Battery</text>
  <text x="154" y="1160" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">protection &gt; Maximum (80%)</text>

  <text x="380" y="1318" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Arial, sans-serif" font-size="20">Illustrative screenshot style guide</text>
</svg>
